<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workspace</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>AI Workspace</h1>
    <span id="status" class="badge">conectando…</span>
  </header>
  <main>
    <section>
      <h2>Proyectos</h2>
      <div class="row">
        <button id="add-project">Añadir carpeta…</button>
        <select id="project"></select>
      </div>
      <p id="project-msg" class="msg"></p>
    </section>
    <section>
      <h2>Nuevo run</h2>
      <div class="row">
        <select id="adapter"></select>
        <select id="mode">
          <option value="read">Solo lectura (plan)</option>
          <option value="write">Escritura (en worktree)</option>
        </select>
      </div>
      <textarea id="prompt" rows="4" placeholder="¿Qué debe hacer el agente?"></textarea>
      <label id="policy-row" hidden><input type="checkbox" id="policy"> Acepto que este proveedor puede usar los datos para entrenar modelos</label>
      <div class="row"><button id="start" class="primary">Lanzar</button><span id="run-msg" class="msg"></span></div>
    </section>
    <section>
      <h2>Runs</h2>
      <table><thead><tr><th>Estado</th><th>Agente</th><th>Modo</th><th>Título</th><th></th></tr></thead><tbody id="runs"></tbody></table>
    </section>
    <section id="review" hidden>
      <h2>Revisión de cambios <span id="review-title" class="muted"></span></h2>
      <p id="review-summary" class="msg"></p>
      <p id="review-warn" class="msg bad" hidden></p>
      <pre id="review-patch"></pre>
      <div class="row">
        <button id="review-merge" class="primary">Aprobar y fusionar</button>
        <button id="review-close">Cerrar</button>
        <span id="review-msg" class="msg"></span>
      </div>
    </section>
    <section>
      <h2>Terminal<span id="term-title" class="muted"></span></h2>
      <div class="row"><button id="term-new">Nuevo terminal</button><select id="term-select"></select><button id="term-kill">Cerrar terminal</button><span id="term-msg" class="msg"></span></div>
      <div id="term"></div>
    </section>
    <section>
      <h2>Salida <span id="out-title" class="muted"></span></h2>
      <pre id="output">Selecciona un run.</pre>
    </section>
  </main>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
