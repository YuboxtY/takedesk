<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Workspace</title>
  <link rel="stylesheet" href="../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>AI Workspace</h1>
    <span id="status" class="chip">conectando…</span>
    <select id="project" title="Proyecto activo"></select>
    <button id="add-project">Añadir carpeta…</button>
    <span id="top-msg" class="msg bad"></span>
    <button id="bg-btn" title="Fondo y tema">🎨 Fondo</button>
  </header>
  <div id="spaces" role="tablist" aria-label="Espacios"></div>
  <nav id="toolbar" aria-label="Añadir panel"></nav>
  <main id="canvas-scroll"><div id="canvas"></div></main>
  <div id="hud" role="group" aria-label="Zoom">
    <button id="zoom-out" title="Alejar (Ctrl+Alt+−)">−</button>
    <button id="zoom-reset" title="100 % (Ctrl+Alt+0)"><span id="zoom-label">100 %</span></button>
    <button id="zoom-in" title="Acercar (Ctrl+Alt++)">＋</button>
    <button id="zoom-fit" title="Ajustar todo (Ctrl+Alt+F)">⤢ Ajustar</button>
  </div>
  <div id="bg-menu" hidden></div>
  <div id="help" hidden></div>
  <script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="urlutil.js"></script>
  <script src="tiles.js"></script>
  <script src="panes.js"></script>
  <script src="appearance.js"></script>
  <script src="app.js"></script>
</body>
</html>
